# Tania backend GraphQL contract. This file is the single source of truth for
# the API; graph/generated.go is generated from it and never hand-edited.
# Feature scope: 001-employee-digital-talent-management.
#
# The full design contract (69 operations) lives in
# specs/.../contracts/schema.graphql and is ported phase by phase
# (api-conventions §7). This file currently covers: authentication, master data
# (Unit/Chapter/JobRole/Project), employee records, user accounts, and the
# audit trail — the Foundational phase plus US6 and US1.
#
# Naming (api-conventions §5): Time for timestamps, Date for calendar dates,
# ID for identifiers, JSON for free-form payloads. The design contract's
# UUID/DateTime aliases are deliberately not ported so a value has exactly one
# GraphQL name.
#
# Authorization is enforced server-side (FR-16); forbidden calls return
# extensions.code = FORBIDDEN. Chapter scope never widens through arguments.

scalar Time
scalar Date
scalar JSON

# ------------------------------- Enums --------------------------------------

"""Application access roles (fixed set, FR-15)."""
enum AccessRole {
  ADMIN
  OPERATION
  CHAPTER
  TALENT
}

enum AccountStatus {
  ACTIVE
  INACTIVE
}

enum EmployeeStatus {
  ACTIVE
  INACTIVE
  RESIGNED
  RETIRED
}

enum ContractType {
  PKWT
  PKWTT
}

enum EmploymentContractStatus {
  """Turunan tanggal, tanpa cron (FR-34)."""
  ACTIVE
  ENDED
  TERMINATED
}

enum ContractEndReason {
  EXPIRY
  RESIGN
  RETIREMENT
  MUTATION
}

enum AuditAction {
  CREATE
  UPDATE
  DEACTIVATE
  DELETE
  LOGIN
  LOGOUT
}

enum AssignmentStatus {
  ACTIVE
  COMPLETED
}

enum IdpStatus {
  IN_PROGRESS
  NEEDS_REVIEW
  COMPLETED
}

enum DevelopmentActionStatus {
  TODO
  IN_PROGRESS
  COMPLETED
}

enum DevelopmentMethod {
  PROJECT_ASSIGNMENT
  MENTORING
  TRAINING
  CROSS_FUNCTIONAL_EXPOSURE
  SELF_STUDY
}

enum EvaluationAnswerType {
  SCALE_1_5
  SCALE_1_10
  YES_NO
  FREE_TEXT
}

enum PerformanceEvaluationStatus {
  DRAFT
  SUBMITTED
}

enum EvaluationPeriodState {
  """Tanggal mulai belum tiba."""
  SCHEDULED
  """Tanggal saat ini berada dalam rentang periode (FR-25)."""
  RUNNING
  """Melewati tanggal selesai — hanya baca."""
  CLOSED
}

enum EvaluationFillState {
  NOT_EVALUATED
  EVALUATED
}

# ------------------------------ Pagination ----------------------------------

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Health {
  status: String!
  version: String!
}

# ------------------------------- Identity -----------------------------------

"""An application account with exactly one access role."""
type User {
  id: ID!
  email: String!
  fullName: String!
  accessRole: AccessRole!
  status: AccountStatus!
  employee: Employee
  lastLoginAt: Time
  createdAt: Time!
  updatedAt: Time!
}

"""A freshly issued access/refresh token pair."""
type AuthPayload {
  accessToken: String!
  accessTokenExpiresAt: Time!
  refreshToken: String!
  refreshTokenExpiresAt: Time!
  user: User!
}

input LocalLoginInput {
  email: String!
  password: String!
}

# ------------------------------- Master data --------------------------------

"""Unit master data (FR-18)."""
type Unit {
  id: ID!
  name: String!
  isActive: Boolean!
  """Projects owned by this unit, alphabetical."""
  projects: [Project!]!
  createdAt: Time!
  updatedAt: Time!
}

"""Chapter master data (FR-24)."""
type Chapter {
  id: ID!
  name: String!
  isActive: Boolean!
  """Job roles owned by this chapter, alphabetical."""
  jobRoles: [JobRole!]!
  createdAt: Time!
  updatedAt: Time!
}

"""Master Data Role — peran jabatan/fungsional (bukan peran akses, FR-20)."""
type JobRole {
  id: ID!
  name: String!
  isActive: Boolean!
  """null = role tanpa chapter → tidak assignable (FR-22/FR-23)."""
  chapter: Chapter
  createdAt: Time!
  updatedAt: Time!
}

"""Project master data; wajib merujuk tepat satu Unit (FR-19)."""
type Project {
  id: ID!
  name: String!
  unit: Unit!
  isActive: Boolean!
  createdAt: Time!
  updatedAt: Time!
}

# ------------------------------- Employee -----------------------------------

type Employee {
  id: ID!
  fullName: String!
  """NIK tersamar — 4 digit akhir (FR-42); nilai penuh tidak pernah diekspos."""
  nikMasked: String!
  email: String!
  birthDate: Date!
  gender: String
  phone: String
  address: String
  latestEducation: String
  institutionName: String
  major: String
  """Nomor induk karyawan dari kontrak aktif (FR-34); null bila tanpa kontrak aktif."""
  nomorInduk: String
  """Turunan kontrak aktif (FR-35)."""
  unit: Unit
  """Turunan kontrak aktif (FR-35)."""
  jobRole: JobRole
  """Turunan kontrak aktif → jobRole.chapter (FR-23/FR-35); null bila role tanpa chapter."""
  chapter: Chapter
  """status aktif, punya kontrak aktif, DAN jobRole memiliki chapter."""
  assignable: Boolean!
  joinedAt: Date!
  status: EmployeeStatus!
  account: User
  """Riwayat kontrak kerja, terbaru lebih dulu (FR-34)."""
  contracts(first: Int = 25, after: String): EmploymentContractConnection!
  """Riwayat assignment talent, terbaru lebih dulu (FR-07)."""
  assignments(first: Int = 25, after: String): AssignmentConnection!
  """IDP talent dalam cakupan pemanggil (FR-11)."""
  idps(first: Int = 25, after: String): IdpConnection!
  createdAt: Time!
  updatedAt: Time!
}

type EmploymentContract {
  id: ID!
  employee: Employee!
  contractNo: String!
  contractType: ContractType!
  officeEmail: String
  """Employee ID yang berlaku pada kontrak ini (snapshot historis)."""
  nomorInduk: String!
  bandPosition: String
  jobRole: JobRole!
  jobTitle: String
  jobLevel: String
  workLocation: String
  unit: Unit!
  startDate: Date!
  """null untuk PKWTT."""
  endDate: Date
  """Turunan tanggal + terminatedAt, tanpa cron (FR-34)."""
  status: EmploymentContractStatus!
  endReason: ContractEndReason
  terminatedAt: Time
  predecessor: EmploymentContract
  notes: String
  createdBy: User
  createdAt: Time!
  updatedAt: Time!
}

type EmploymentContractEdge { node: EmploymentContract!, cursor: String! }
type EmploymentContractConnection { edges: [EmploymentContractEdge!]!, pageInfo: PageInfo!, totalCount: Int! }

type EmployeeEdge { node: Employee!, cursor: String! }
type EmployeeConnection { edges: [EmployeeEdge!]!, pageInfo: PageInfo!, totalCount: Int! }

input EmployeeFilter {
  """nama / email / nomor induk (via kontrak aktif)"""
  search: String
  unitId: ID
  jobRoleId: ID
  status: EmployeeStatus
  assignableOnly: Boolean
}

input CreateEmployeeInput {
  """NIK 16 digit — unik, disimpan terenkripsi (FR-42)."""
  nik: String!
  fullName: String!
  email: String!
  birthDate: Date!
  gender: String
  phone: String
  address: String
  latestEducation: String
  institutionName: String
  major: String
  joinedAt: Date!
  status: EmployeeStatus
  """Auto-create akun Entra saat data tersimpan (FR-43); default true."""
  autoCreateEntra: Boolean = true
}

input UpdateEmployeeInput {
  fullName: String
  email: String
  birthDate: Date
  gender: String
  phone: String
  address: String
  latestEducation: String
  institutionName: String
  major: String
  joinedAt: Date
  status: EmployeeStatus
}

input CreateEmploymentContractInput {
  employeeId: ID!
  contractNo: String!
  contractType: ContractType!
  officeEmail: String
  nomorInduk: String!
  bandPosition: String
  jobRoleId: ID!
  jobTitle: String
  jobLevel: String
  workLocation: String
  unitId: ID!
  startDate: Date!
  """Wajib untuk PKWT, null untuk PKWTT."""
  endDate: Date
  notes: String
}

input UpdateEmploymentContractInput {
  contractNo: String
  officeEmail: String
  bandPosition: String
  jobTitle: String
  jobLevel: String
  workLocation: String
  notes: String
}

"""Perpanjangan PKWT — kontrak baru mulai setelah kontrak lama berakhir (FR-36)."""
input RenewContractInput {
  predecessorContractId: ID!
  contractNo: String!
  contractType: ContractType! = PKWT
  officeEmail: String
  nomorInduk: String!
  bandPosition: String
  jobRoleId: ID!
  jobTitle: String
  jobLevel: String
  workLocation: String
  unitId: ID!
  startDate: Date!
  endDate: Date
  notes: String
}

"""Mutasi di tengah kontrak — akhiri kontrak lama + kontrak baru efektif tanggal mutasi (FR-38)."""
input RecordMutationInput {
  employeeId: ID!
  effectiveDate: Date!
  contractNo: String!
  nomorInduk: String!
  jobRoleId: ID!
  unitId: ID!
  officeEmail: String
  bandPosition: String
  jobTitle: String
  jobLevel: String
  workLocation: String
  endDate: Date
  notes: String
}

input EmploymentContractFilter {
  """nama karyawan / nomor kontrak / nomor induk"""
  search: String
  employeeId: ID
  unitId: ID
  jobRoleId: ID
  contractType: ContractType
  status: EmploymentContractStatus
  """Kontrak yang berakhir pada/before tanggal ini (jendela H-90/H-30)."""
  expiringBefore: Date
}

# --------------------------------- Audit ------------------------------------

"""One entry of the audit trail (FR-17), append-only."""
type AuditLog {
  id: ID!
  occurredAt: Time!
  actor: User
  actorRole: AccessRole
  action: AuditAction!
  entityType: String!
  entityId: String
  before: String
  after: String
  ip: String
  userAgent: String
  requestId: String
}

type AuditLogEdge { node: AuditLog!, cursor: String! }
type AuditLogConnection { edges: [AuditLogEdge!]!, pageInfo: PageInfo!, totalCount: Int! }

input AuditLogFilter {
  entityType: String
  entityId: String
  actorUserId: ID
  action: AuditAction
  from: Time
  to: Time
}

# ------------------------------- Assignment ---------------------------------

"""Penempatan talent pada sebuah project untuk satu periode (FR-05)."""
type Assignment {
  id: ID!
  talent: Employee!
  project: Project!
  jobRole: JobRole!
  periodStart: Date!
  periodEnd: Date
  status: AssignmentStatus!
  createdBy: User
  createdAt: Time!
  updatedAt: Time!
}

type AssignmentEdge { node: Assignment!, cursor: String! }
type AssignmentConnection { edges: [AssignmentEdge!]!, pageInfo: PageInfo!, totalCount: Int! }

input AssignmentFilter {
  employeeId: ID
  projectId: ID
  status: AssignmentStatus
}

input CreateAssignmentInput {
  employeeId: ID!
  projectId: ID!
  jobRoleId: ID!
  periodStart: Date!
  periodEnd: Date
}

input UpdateAssignmentInput {
  projectId: ID
  jobRoleId: ID
  periodStart: Date
  periodEnd: Date
}

# ---------------------------------- IDP -------------------------------------

"""Individual Development Plan milik satu talent (FR-08)."""
type Idp {
  id: ID!
  talent: Employee!
  status: IdpStatus!
  developmentObjective: String!
  currentAssessment: String!
  gapAnalysis: String!
  timelineStart: Date!
  timelineEnd: Date!
  successIndicators: String!
  actions: [DevelopmentAction!]!
  reviews: [ReviewLog!]!
  revisions: [IdpRevision!]!
  createdBy: User
  createdAt: Time!
  updatedAt: Time!
}

type DevelopmentAction {
  id: ID!
  description: String!
  method: DevelopmentMethod!
  status: DevelopmentActionStatus!
  dueDate: Date
  createdAt: Time!
  updatedAt: Time!
}

type ReviewLog {
  id: ID!
  reviewDate: Date!
  summary: String!
  followUp: String
  createdBy: User
  createdAt: Time!
}

type IdpRevision {
  id: ID!
  revisionNo: Int!
  changedBy: User
  changeNote: String
  createdAt: Time!
}

type IdpEdge { node: Idp!, cursor: String! }
type IdpConnection { edges: [IdpEdge!]!, pageInfo: PageInfo!, totalCount: Int! }

input IdpFilter {
  status: IdpStatus
  employeeId: ID
  needsReviewOnly: Boolean
}

input CreateIdpInput {
  employeeId: ID!
  developmentObjective: String!
  currentAssessment: String!
  gapAnalysis: String!
  timelineStart: Date!
  timelineEnd: Date!
  successIndicators: String!
  actions: [CreateDevelopmentActionInput!]
}

input UpdateIdpInput {
  developmentObjective: String
  currentAssessment: String
  gapAnalysis: String
  timelineStart: Date
  timelineEnd: Date
  successIndicators: String
  changeNote: String
}

input CreateDevelopmentActionInput {
  description: String!
  method: DevelopmentMethod!
  dueDate: Date
}

input AddIdpReviewInput {
  reviewDate: Date!
  summary: String!
  followUp: String
}

# ------------------------- Performance evaluation ---------------------------

type EvaluationCriterion {
  id: ID!
  label: String!
  answerType: EvaluationAnswerType!
  position: Int!
}

type EvaluationTemplate {
  id: ID!
  name: String!
  isActive: Boolean!
  criteria: [EvaluationCriterion!]!
  createdAt: Time!
  updatedAt: Time!
}

"""Periode evaluasi; terpinned ke satu template saat dibuat (FR-25)."""
type EvaluationPeriod {
  id: ID!
  name: String!
  startDate: Date!
  endDate: Date!
  template: EvaluationTemplate!
  isActive: Boolean!
  """Turunan dari tanggal saat ini, bukan kolom tersimpan."""
  state: EvaluationPeriodState!
  createdAt: Time!
  updatedAt: Time!
}

type EvaluationAnswer {
  criterion: EvaluationCriterion!
  valueNumeric: Float
  valueBool: Boolean
  valueText: String
}

"""Penilaian performa satu talent untuk satu periode (FR-26)."""
type PerformanceEvaluation {
  id: ID!
  period: EvaluationPeriod!
  talent: Employee!
  answers: [EvaluationAnswer!]!
  summaryAchievement: String
  developmentNotes: String
  status: PerformanceEvaluationStatus!
  createdBy: User
  createdAt: Time!
  updatedAt: Time!
}

type EvaluationPeriodRosterEntry {
  talent: Employee!
  fillState: EvaluationFillState!
  evaluation: PerformanceEvaluation
}

type PerformanceEvaluationEdge { node: PerformanceEvaluation!, cursor: String! }
type PerformanceEvaluationConnection {
  edges: [PerformanceEvaluationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input EvaluationCriterionInput {
  label: String!
  answerType: EvaluationAnswerType!
  position: Int!
}

input CreateEvaluationTemplateInput {
  name: String!
  criteria: [EvaluationCriterionInput!]!
}

input CreateEvaluationPeriodInput {
  name: String!
  startDate: Date!
  endDate: Date!
  templateId: ID!
}

input EvaluationAnswerInput {
  criterionId: ID!
  valueNumeric: Float
  valueBool: Boolean
  valueText: String
}

input UpsertPerformanceEvaluationInput {
  periodId: ID!
  employeeId: ID!
  answers: [EvaluationAnswerInput!]
  summaryAchievement: String
  developmentNotes: String
}

# ----------------------------------- CV -------------------------------------

"""Profil CV milik talent (FR-12); pengalaman kerja diturunkan dari assignment."""
type CvProfile {
  id: ID!
  talent: Employee!
  summary: String
  educations: [CvEducation!]!
  certifications: [CvCertification!]!
  skills: [CvSkill!]!
  """Diturunkan dari riwayat assignment (FR-12) — termasuk yang sudah diakhiri."""
  workExperience: [Assignment!]!
  updatedAt: Time!
}

type CvEducation {
  id: ID!
  institution: String!
  degree: String
  fieldOfStudy: String
  startYear: Int
  endYear: Int
}

type CvCertification {
  id: ID!
  name: String!
  issuer: String
  issuedDate: Date
  expiryDate: Date
  credentialUrl: String
}

type CvSkill {
  id: ID!
  name: String!
  level: String
}

input UpsertCvProfileInput { summary: String }

input CvEducationInput {
  institution: String!
  degree: String
  fieldOfStudy: String
  startYear: Int
  endYear: Int
}

input CvCertificationInput {
  name: String!
  issuer: String
  issuedDate: Date
  expiryDate: Date
  credentialUrl: String
}

input CvSkillInput { name: String!, level: String }

# ------------------------------- Dashboard ----------------------------------

type AdminDashboard {
  talentsPerChapter: [ChapterCount!]!
  accountsPerRole: [RoleCount!]!
  inactiveAccounts: Int!
  masterDataActiveCounts: [MasterDataCount!]!
}

type OperationDashboard {
  totalActiveEmployees: Int!
  employeesPerUnit: [UnitCount!]!
  nonAssignableEmployees: Int!
  recentEmployeeChanges: [Employee!]!
  """Kontrak berakhir dalam jendela H-90/H-30 (FR-40)."""
  expiringContracts: [EmploymentContract!]!
  """Karyawan memasuki jendela pra-pensiun (FR-40)."""
  preRetirementEmployees: [Employee!]!
}

type ChapterDashboard {
  idpStatusDistribution: [IdpStatusCount!]!
  actionProgress: [ActionStatusCount!]!
  unassignedTalents: [Employee!]!
  idpsNeedingReview: Int!
  currentEvaluationPeriod: EvaluationPeriod
}

type TalentDashboard {
  activeAssignments: [Assignment!]!
  idpProgress: [ActionStatusCount!]!
  latestEvaluation: PerformanceEvaluation
  upcomingActionDeadlines: [DevelopmentAction!]!
}

union Dashboard = AdminDashboard | OperationDashboard | ChapterDashboard | TalentDashboard

type ChapterCount { chapter: Chapter!, count: Int! }
type UnitCount { unit: Unit!, count: Int! }
type RoleCount { role: AccessRole!, count: Int! }
type MasterDataCount { kind: String!, active: Int!, inactive: Int! }
type IdpStatusCount { status: IdpStatus!, count: Int! }
type ActionStatusCount { status: DevelopmentActionStatus!, count: Int! }

# -------------------------------- Queries -----------------------------------

type Query {
  """Liveness and build information; no authentication required."""
  health: Health!

  """Profil user yang sedang login."""
  me: User!

  # --- Master data (Admin tulis; read-only untuk peran lain) ---
  units(includeInactive: Boolean = false): [Unit!]!
  chapters(includeInactive: Boolean = false): [Chapter!]!
  jobRoles(includeInactive: Boolean = false): [JobRole!]!
  projects(unitId: ID, includeInactive: Boolean = false): [Project!]!

  # --- Employee (Operation tulis; Chapter/Admin baca) ---
  employees(filter: EmployeeFilter, first: Int = 25, after: String): EmployeeConnection!
  employee(id: ID!): Employee

  """Kandidat assignment/IDP baru: karyawan aktif dengan kontrak aktif dan assignable (FR-04, FR-23, FR-35)."""
  assignableTalents(search: String, first: Int = 25, after: String): EmployeeConnection!

  # --- Kontrak kerja (Operation) ---
  employmentContracts(filter: EmploymentContractFilter, first: Int = 25, after: String): EmploymentContractConnection!
  employmentContract(id: ID!): EmploymentContract
  """Kontrak berakhir dalam jendela hari (default 90) — kandidat perpanjangan (FR-40, US10)."""
  expiringContracts(days: Int = 90, first: Int = 25, after: String): EmploymentContractConnection!
  """Kontrak habis tanpa perpanjangan — perlu tindak lanjut Operation (US10 skenario 4)."""
  employeesNeedingFollowUp(first: Int = 25, after: String): EmployeeConnection!
  """Talent yang belum memiliki akun Entra (FR-44)."""
  employeesWithoutEntra(first: Int = 25, after: String): EmployeeConnection!

  # --- Assignment ---
  assignments(filter: AssignmentFilter, first: Int = 25, after: String): AssignmentConnection!

  # --- IDP ---
  idps(filter: IdpFilter, first: Int = 25, after: String): IdpConnection!
  idp(id: ID!): Idp
  """IDP milik Talent yang sedang login; null = belum ada IDP (FR-14)."""
  myIdp: Idp

  # --- CV ---
  myCvProfile: CvProfile
  """Profil CV untuk pemiliknya atau Chapter dalam cakupan (hanya baca, FR-13)."""
  cvProfile(employeeId: ID!): CvProfile

  # --- Dashboard per peran (FR-29/FR-30) ---
  dashboard: Dashboard!

  # --- Evaluasi ---
  evaluationTemplates(includeInactive: Boolean = false): [EvaluationTemplate!]!
  evaluationPeriods(includeInactive: Boolean = false): [EvaluationPeriod!]!
  currentEvaluationPeriod: EvaluationPeriod
  evaluationRoster(periodId: ID!, first: Int = 25, after: String): [EvaluationPeriodRosterEntry!]!
  performanceEvaluations(periodId: ID, employeeId: ID, first: Int = 25, after: String): PerformanceEvaluationConnection!
  """Evaluasi milik Talent yang sedang login (FR-27)."""
  myPerformanceEvaluations: [PerformanceEvaluation!]!

  # --- Akun (Admin) ---
  users(search: String, accessRole: AccessRole, status: AccountStatus): [User!]!

  # --- Audit (Admin) ---
  auditLogs(filter: AuditLogFilter, first: Int = 25, after: String): AuditLogConnection!
}

# ------------------------------- Mutations ----------------------------------

type Mutation {
  # --- Auth ---
  login(input: LocalLoginInput!): AuthPayload!

  """Exchange a refresh token for a new token pair (rotating)."""
  refreshSession(refreshToken: String!): AuthPayload!

  """Revoke the current access token and, when supplied, the refresh token."""
  logout(refreshToken: String): Boolean!

  # --- Master data (Admin) ---
  createUnit(name: String!): Unit!
  updateUnit(id: ID!, name: String!): Unit!
  setUnitActive(id: ID!, isActive: Boolean!): Unit!

  createChapter(name: String!): Chapter!
  updateChapter(id: ID!, name: String!): Chapter!
  setChapterActive(id: ID!, isActive: Boolean!): Chapter!

  createJobRole(name: String!, chapterId: ID): JobRole!
  updateJobRole(id: ID!, name: String!): JobRole!
  setJobRoleChapter(id: ID!, chapterId: ID): JobRole!
  setJobRoleActive(id: ID!, isActive: Boolean!): JobRole!

  createProject(name: String!, unitId: ID!): Project!
  updateProject(id: ID!, name: String!, unitId: ID!): Project!
  setProjectActive(id: ID!, isActive: Boolean!): Project!

  # --- Employee (Operation) ---
  createEmployee(input: CreateEmployeeInput!): Employee!
  updateEmployee(id: ID!, input: UpdateEmployeeInput!): Employee!
  deactivateEmployee(id: ID!, acknowledgeActiveWork: Boolean = false): Employee!
  """Resign: akhiri kontrak aktif (end_reason=resign), status → RESIGNED, nonaktifkan akun + Entra (FR-37, FR-46)."""
  resignEmployee(id: ID!, effectiveDate: Date!, reason: String, acknowledgeActiveWork: Boolean = false): Employee!
  """Pensiun: akhiri kontrak aktif (end_reason=retirement), status → RETIRED (FR-39)."""
  retireEmployee(id: ID!, effectiveDate: Date!, acknowledgeActiveWork: Boolean = false): Employee!

  # --- Kontrak kerja (Operation) ---
  createEmploymentContract(input: CreateEmploymentContractInput!): EmploymentContract!
  updateEmploymentContract(id: ID!, input: UpdateEmploymentContractInput!): EmploymentContract!
  """Perpanjangan PKWT — kontrak baru terkait predecessor (FR-36)."""
  renewEmploymentContract(input: RenewContractInput!): EmploymentContract!
  """Mutasi: akhiri kontrak lama + kontrak baru efektif tanggal mutasi (FR-38)."""
  recordEmployeeMutation(input: RecordMutationInput!): EmploymentContract!

  # --- Provisi Entra (Operation, FR-43–FR-46) ---
  """Provisioning manual/ulang akun Entra untuk talent yang belum punya (FR-44)."""
  provisionEntraAccount(employeeId: ID!): Employee!

  # --- Assignment (Chapter) ---
  createAssignment(input: CreateAssignmentInput!): Assignment!
  updateAssignment(id: ID!, input: UpdateAssignmentInput!): Assignment!
  endAssignment(id: ID!, periodEnd: Date!): Assignment!

  # --- IDP (Chapter kecuali update status aksi oleh Talent) ---
  createIdp(input: CreateIdpInput!): Idp!
  updateIdp(id: ID!, input: UpdateIdpInput!): Idp!
  closeIdp(id: ID!): Idp!
  addDevelopmentAction(idpId: ID!, input: CreateDevelopmentActionInput!): DevelopmentAction!
  updateDevelopmentAction(id: ID!, description: String, method: DevelopmentMethod, dueDate: Date): DevelopmentAction!
  """Talent pemilik atau Chapter chapter terkait (FR-09)."""
  updateDevelopmentActionStatus(id: ID!, status: DevelopmentActionStatus!): DevelopmentAction!
  deleteDevelopmentAction(id: ID!): Boolean!
  addIdpReview(idpId: ID!, input: AddIdpReviewInput!): ReviewLog!

  # --- CV (Talent pemilik, FR-12/FR-13) ---
  upsertCvProfile(input: UpsertCvProfileInput!): CvProfile!
  addCvEducation(input: CvEducationInput!): CvEducation!
  updateCvEducation(id: ID!, input: CvEducationInput!): CvEducation!
  deleteCvEducation(id: ID!): Boolean!
  addCvCertification(input: CvCertificationInput!): CvCertification!
  updateCvCertification(id: ID!, input: CvCertificationInput!): CvCertification!
  deleteCvCertification(id: ID!): Boolean!
  addCvSkill(input: CvSkillInput!): CvSkill!
  updateCvSkill(id: ID!, input: CvSkillInput!): CvSkill!
  deleteCvSkill(id: ID!): Boolean!

  # --- Evaluasi (Admin: template & periode; Chapter: evaluasi) ---
