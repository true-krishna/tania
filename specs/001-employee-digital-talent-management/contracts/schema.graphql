# Tania backend GraphQL contract. This file is the single source of truth for
# the API; graph/generated.go is generated from it and never hand-edited.
# Feature scope: 001-employee-digital-talent-management.
#
# The full design contract (69 operations) lives in
# specs/.../contracts/schema.graphql and is ported phase by phase
# (api-conventions §7). This file currently covers: authentication, master data
# (Unit/Chapter/JobRole/Project), employee records, user accounts, and the
# audit trail — the Foundational phase plus US6 and US1.
#
# Naming (api-conventions §5): Time for timestamps, Date for calendar dates,
# ID for identifiers, JSON for free-form payloads. The design contract's
# UUID/DateTime aliases are deliberately not ported so a value has exactly one
# GraphQL name.
#
# Authorization is enforced server-side (FR-16); forbidden calls return
# extensions.code = FORBIDDEN. Chapter scope never widens through arguments.

scalar Time
scalar Date
scalar JSON

# ------------------------------- Enums --------------------------------------

"""Application access roles (fixed set, FR-15).

The four built-in roles of the dynamic RBAC configuration (FR-03 amandemen
2026-10-19); a role built on one of them as its template keeps this enum as the
value of AccessRoleDefinition.templateRole."""
enum AccessRole {
  ADMIN
  OPERATION
  CHAPTER
  TALENT
}

enum AccountStatus {
  ACTIVE
  INACTIVE
}

"""Jenis aktivitas pribadi talent (FR-003)."""
enum ActivityType {
  working
  training
}

enum EmployeeStatus {
  ACTIVE
  INACTIVE
  RESIGNED
  RETIRED
}

"""Status hasil provisi akun Entra (FR-44/FR-45); tanpa record = belum dibuat."""
enum EntraProvisionStatus {
  """Undangan Entra terkirim (email telkom.co.id, FR-45)."""
  INVITED
  """Akun dibuat dengan UPN digitaltelkom.id (domain lain, FR-45)."""
  CREATED
  """Provisi gagal — menunggu provisioning ulang (FR-44)."""
  FAILED
  """Akun dinonaktifkan saat terminasi (FR-46)."""
  DISABLED
}

"""Jenis aksi provisi Entra (FR-45)."""
enum EntraProvisionAction {
  INVITE
  CREATE
}

"""Kolom yang dapat diurutkan pada daftar provisi Entra (FR-44)."""
enum EntraEmployeeSortField {
  FULL_NAME
  EMAIL
  PROVISION_STATUS
}

"""Arah pengurutan daftar (FR-44)."""
enum SortDirection {
  ASC
  DESC
}

"""Hasil provisioning akun Entra seorang talent (FR-44, FR-45)."""
type EntraProvision {
  status: EntraProvisionStatus!
  action: EntraProvisionAction!
  """UPN hasil create; untuk invitation berisi email yang diundang (FR-45)."""
  upn: String
  """Object ID akun yang terlink — penanda anti-duplikat (FR-43)."""
  objectId: String
  """Pesan kegagalan terakhir; null bila berhasil (FR-44)."""
  lastError: String
  updatedAt: Time!
}

enum ContractType {
  """TPPBW PROHIRE."""
  TPPBW_PROHIRE
  """EMPLOYEE MOBILIT."""
  EMPLOYEE_MOBILIT
  """PROJECT BASED PROCUREMENT."""
  PROJECT_BASED_PROCUREMENT
  """OUTSOURCE TKP."""
  OUTSOURCE_TKP
  """KARYAWAN TETAP — kontrak tanpa batas waktu."""
  KARYAWAN_TETAP
  """TKWT DIGITAL TALENT."""
  TKWT_DIGITAL_TALENT
}

enum EmploymentContractStatus {
  """Turunan tanggal, tanpa cron (FR-34)."""
  ACTIVE
  ENDED
  TERMINATED
}

enum ContractEndReason {
  EXPIRY
  RESIGN
  RETIREMENT
  MUTATION
}

"""Keputusan 2026-10-10 — domain nilai dikunci pemilik produk."""
enum Gender {
  FEMALE
  MALE
}

enum WorkLocation {
  JAKARTA
  BANDUNG
  """Belum ditetapkan (kontrak lama tanpa lokasi kerja)."""
  UNDEFINED
}

enum BandPosition {
  I
  II
  III
  IV
  V
  VI
  """Belum ditetapkan."""
  UNDEFINED
}

"""Jenjang pendidikan terkontrol (D11 spek 003) — lima nilai; label tampilan
"SMA/SMK Sederajat", "D3", "S1", "S2", "S3"."""
enum EducationLevel {
  SMA_SMK_SEDERAJAT
  D3
  S1
  S2
  S3
}

enum AuditAction {
  CREATE
  UPDATE
  DEACTIVATE
  DELETE
  LOGIN
  LOGOUT
  """Perpanjangan kontrak (FR-36/FR-41)."""
  RENEW
  """Resign (FR-37/FR-41)."""
  RESIGN
  """Mutasi (FR-38/FR-41)."""
  MUTATE
  """Pensiun (FR-39/FR-41)."""
  RETIRE
  """Pengakhiran kontrak lama pada mutasi (FR-38/FR-41)."""
  END
  """Anonimisasi retensi data pribadi (T041)."""
