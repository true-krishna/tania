}

enum AssignmentStatus {
  ACTIVE
  COMPLETED
}

enum IdpStatus {
  IN_PROGRESS
  NEEDS_REVIEW
  COMPLETED
}

enum DevelopmentActionStatus {
  TODO
  IN_PROGRESS
  COMPLETED
}

enum DevelopmentMethod {
  PROJECT_ASSIGNMENT
  MENTORING
  TRAINING
  CROSS_FUNCTIONAL_EXPOSURE
  SELF_STUDY
}

enum EvaluationAnswerType {
  SCALE_1_5
  SCALE_1_10
  YES_NO
  FREE_TEXT
}

enum PerformanceEvaluationStatus {
  DRAFT
  SUBMITTED
}

enum EvaluationPeriodState {
  """Tanggal mulai belum tiba."""
  SCHEDULED
