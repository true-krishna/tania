# ------------------------------- Mutations ----------------------------------

type Mutation {
  # --- Auth ---
  login(input: LocalLoginInput!): AuthPayload!

  """Publik. Menukar authorization code dengan sesi Tania (FR-003/FR-004)."""
  loginWithEntra(input: EntraLoginInput!): AuthPayload!

  """Exchange a refresh token for a new token pair (rotating)."""
  refreshSession(refreshToken: String!): AuthPayload!

  """Revoke the current access token and, when supplied, the refresh token."""
  logout(refreshToken: String): Boolean!

  # --- Master data (Admin) ---
  createUnit(code: String!, name: String!): Unit!
  updateUnit(id: ID!, code: String!, name: String!): Unit!
  setUnitActive(id: ID!, isActive: Boolean!): Unit!

  createChapter(name: String!): Chapter!
  updateChapter(id: ID!, name: String!): Chapter!
  setChapterActive(id: ID!, isActive: Boolean!): Chapter!

  createJobRole(name: String!, chapterId: ID): JobRole!
  updateJobRole(id: ID!, name: String!): JobRole!
  setJobRoleChapter(id: ID!, chapterId: ID): JobRole!
  setJobRoleActive(id: ID!, isActive: Boolean!): JobRole!

  createProject(name: String!, unitId: ID!): Project!
  updateProject(id: ID!, name: String!, unitId: ID!): Project!
  setProjectActive(id: ID!, isActive: Boolean!): Project!

  # --- Employee (Operation/Admin) ---
  createEmployee(input: CreateEmployeeInput!): Employee!
  updateEmployee(id: ID!, input: UpdateEmployeeInput!): Employee!
  deactivateEmployee(id: ID!, acknowledgeActiveWork: Boolean = false): Employee!
  """Resign: akhiri kontrak aktif (end_reason=resign), status → RESIGNED, nonaktifkan akun (FR-37, FR-46)."""
  resignEmployee(id: ID!, effectiveDate: Date!, reason: String, acknowledgeActiveWork: Boolean = false): Employee!
  """Pensiun: akhiri kontrak aktif (end_reason=retirement), status → RETIRED (FR-39)."""
  retireEmployee(id: ID!, effectiveDate: Date!, acknowledgeActiveWork: Boolean = false): Employee!

  # --- Kontrak kerja (Operation/Admin) ---
  createEmploymentContract(input: CreateEmploymentContractInput!): EmploymentContract!
  updateEmploymentContract(id: ID!, input: UpdateEmploymentContractInput!): EmploymentContract!
  """Perpanjangan kontrak berbatas waktu — kontrak baru terkait predecessor (FR-36)."""
  renewEmploymentContract(input: RenewContractInput!): EmploymentContract!
  """Mutasi: akhiri kontrak lama + kontrak baru efektif tanggal mutasi (FR-38)."""
  recordEmployeeMutation(input: RecordMutationInput!): EmploymentContract!
  """Ubah usia pensiun (tahun); hanya Admin (T042)."""
  setRetirementAge(years: Int!): Int!

  # --- Provisi Entra (Operation/Admin, FR-43–FR-46) ---
  """Provisioning manual/ulang akun Entra untuk talent yang belum punya (FR-44).
Hasil terlihat pada entraProvision talent; kegagalan tercatat di sana (status FAILED) tanpa menggagalkan mutasi."""
  provisionEntraAccount(employeeId: ID!): Employee!

  # --- Assignment (Chapter) ---
  createAssignment(input: CreateAssignmentInput!): Assignment!
  updateAssignment(id: ID!, input: UpdateAssignmentInput!): Assignment!
  endAssignment(id: ID!, periodEnd: Date!): Assignment!

  # --- Aktivitas pribadi (pemilik; FR-008–FR-010) ---
  createPersonalWorkActivity(input: CreatePersonalWorkActivityInput!): PersonalWorkActivity!
  updatePersonalWorkActivity(id: ID!, input: UpdatePersonalWorkActivityInput!): PersonalWorkActivity!
  """Soft-delete; baris dan jejak audit tetap tersimpan (FR-009)."""
  deletePersonalWorkActivity(id: ID!): PersonalWorkActivity!

  # --- IDP (Chapter kecuali update status aksi oleh Talent) ---
  createIdp(input: CreateIdpInput!): Idp!
  updateIdp(id: ID!, input: UpdateIdpInput!): Idp!
  closeIdp(id: ID!): Idp!
  addDevelopmentAction(idpId: ID!, input: CreateDevelopmentActionInput!): DevelopmentAction!
  updateDevelopmentAction(id: ID!, description: String, method: DevelopmentMethod, dueDate: Date): DevelopmentAction!
  """Talent pemilik atau Chapter chapter terkait (FR-09)."""
  updateDevelopmentActionStatus(id: ID!, status: DevelopmentActionStatus!): DevelopmentAction!
  deleteDevelopmentAction(id: ID!): Boolean!
  addIdpReview(idpId: ID!, input: AddIdpReviewInput!): ReviewLog!

  # --- CV (Talent pemilik, FR-12/FR-13) ---
  upsertCvProfile(input: UpsertCvProfileInput!): CvProfile!
  addCvEducation(input: CvEducationInput!): CvEducation!
  updateCvEducation(id: ID!, input: CvEducationInput!): CvEducation!
  deleteCvEducation(id: ID!): Boolean!
  addCvCertification(input: CvCertificationInput!): CvCertification!
  updateCvCertification(id: ID!, input: CvCertificationInput!): CvCertification!
  deleteCvCertification(id: ID!): Boolean!
  addCvSkill(input: CvSkillInput!): CvSkill!
  updateCvSkill(id: ID!, input: CvSkillInput!): CvSkill!
  deleteCvSkill(id: ID!): Boolean!

  # --- Evaluasi (Admin: template & periode; Chapter: evaluasi) ---
  createEvaluationTemplate(input: CreateEvaluationTemplateInput!): EvaluationTemplate!
  updateEvaluationTemplate(id: ID!, name: String, criteria: [EvaluationCriterionInput!]): EvaluationTemplate!
  setEvaluationTemplateActive(id: ID!, isActive: Boolean!): EvaluationTemplate!

  createEvaluationPeriod(input: CreateEvaluationPeriodInput!): EvaluationPeriod!
  updateEvaluationPeriod(id: ID!, name: String, startDate: Date, endDate: Date): EvaluationPeriod!
  setEvaluationPeriodActive(id: ID!, isActive: Boolean!): EvaluationPeriod!

  upsertPerformanceEvaluation(input: UpsertPerformanceEvaluationInput!): PerformanceEvaluation!
  submitPerformanceEvaluation(id: ID!): PerformanceEvaluation!

  # --- Akun user (Admin) ---
  """Buat akun untuk seorang karyawan (Khusus Admin).

  `accessRole` (bawaan) atau `roleName` (bawaan maupun kustom) menunjuk role
  tersimpan; keduanya opsional tetapi tepat satu harus diisi."""
  createUserAccount(employeeId: ID!, email: String!, accessRole: AccessRole, roleName: String, temporaryPassword: String): User!
  """Ubah peran akses sebuah akun (Khusus Admin).

  `accessRole` (bawaan) atau `roleName` (bawaan maupun kustom) menunjuk role
  tersimpan; keduanya opsional tetapi tepat satu harus diisi."""
  updateUserAccessRole(userId: ID!, accessRole: AccessRole, roleName: String): User!
  setUserAccountStatus(userId: ID!, status: AccountStatus!): User!
  revokeUserSessions(userId: ID!): Boolean!

  # --- Konfigurasi akses per role (Admin; FR-03 amandemen 2026-10-19) ---
  """Buat role kustom dari salah satu template bawaan. Khusus Admin."""
  createRole(input: CreateRoleInput!): Role!
  """Ubah label role kustom; nama mesin immutable. Khusus Admin."""
  updateRole(id: ID!, label: String!): Role!
  """Aktifkan/nonaktifkan role kustom. Khusus Admin."""
  setRoleStatus(id: ID!, status: RoleStatus!): Role!
  """Hapus role kustom yang tidak dipakai akun mana pun. Khusus Admin."""
  deleteRole(id: ID!): Boolean!
  """Simpan konfigurasi menu satu role.

  Hanya sel yang benar-benar berbeda dari matriks default FR-03 yang ditulis dan
  dicatat audit. Sel khusus Admin (Accounts, Audit, kelola Master Data) divalidasi
  di server. Khusus Admin."""
  setRoleMenuAccess(roleId: ID!, entries: [RoleMenuAccessInput!]!): [RoleMenuEntry!]!
  """Kembalikan konfigurasi menu satu role ke matriks default FR-03. Khusus Admin."""
  resetRoleMenuConfig(roleId: ID!): [RoleMenuEntry!]!

  # --- Asisten data (Chapter & Operation; FR-01) ---
  """Mulai percakapan baru milik pemanggil."""
  createChatConversation: ChatConversation!
  """Kirim pesan user; sinkron; mengembalikan PESAN ASISTEN hasil grounding.
Pesan USER tersimpan sebelum pemanggilan model; kirim ulang dengan
clientRequestId yang sama bersifat idempoten (tidak menggandakan pesan)."""
  sendChatMessage(conversationId: ID!, content: String!, clientRequestId: ID!): ChatMessage!
}
# --- Bulk assignment (TAN-337) ----------------------------------------------

"""Kegagalan satu baris pada operasi assignment massal."""
type BulkAssignmentError {
  code: BulkAssignmentErrorCode!
  """Pesan siap tampil kepada pengguna (berbahasa Indonesia)."""
  message: String!
}

enum BulkAssignmentErrorCode {
  OUT_OF_SCOPE      # talent/assignment di luar cakupan chapter atau tidak ditemukan
  NOT_ASSIGNABLE    # karyawan nonaktif / tidak assignable
  PROJECT_INACTIVE  # project tidak aktif
  INVALID_PERIOD    # periodEnd < periodStart
  DUPLICATE_ACTIVE  # sudah ada assignment aktif untuk talent+project
  NOT_ACTIVE        # assignment tidak berstatus ACTIVE (bulk edit/delete)
  REFERENCED        # assignment masih dirujuk aktivitas kerja personal (bulk delete)
  BATCH_LIMIT       # jumlah baris melebihi batas 100
  INVALID           # input tidak valid lainnya
}

"""Hasil satu baris operasi assignment massal."""
type BulkAssignmentItemResult {
  """Posisi baris pada input (0-based)."""
  index: Int!
  """Talent yang dimaksud baris ini (bulk add)."""
  employeeId: ID
  """Assignment yang dimaksud baris ini (bulk edit/delete)."""
  assignmentId: ID
  """Assignment hasil — terisi bila baris berhasil (bulk add/edit)."""
  assignment: Assignment
  """Kegagalan baris — terisi bila baris gagal."""
  error: BulkAssignmentError
}

type BulkAssignmentResult {
  succeeded: [BulkAssignmentItemResult!]!
  failed: [BulkAssignmentItemResult!]!
}

input BulkCreateAssignmentsInput {
  projectId: ID!
  periodStart: Date!
  periodEnd: Date
  """Maksimum 100 talent per operasi (FR-07)."""
  employeeIds: [ID!]!
}

input BulkUpdateAssignmentsInput {
  """Hanya assignment berstatus ACTIVE yang dapat diubah."""
  ids: [ID!]!
  """Opsional — project baru untuk semua baris."""
  projectId: ID
  """Opsional — tanggal mulai baru untuk semua baris."""
  periodStart: Date
  """Opsional — tanggal selesai baru; tidak mengosongkan nilai yang sudah terisi (FR-11)."""
  periodEnd: Date
}

extend type Mutation {
  """Buat assignment untuk banyak talent sekaligus (satu project + periode). Chapter + Admin."""
  bulkCreateAssignments(input: BulkCreateAssignmentsInput!): BulkAssignmentResult!
  """Terapkan satu perubahan (project dan/atau periode) ke banyak assignment aktif. Chapter + Admin."""
  bulkUpdateAssignments(input: BulkUpdateAssignmentsInput!): BulkAssignmentResult!
