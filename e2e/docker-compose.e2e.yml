# e2e/docker-compose.e2e.yml — overlay stack E2E laporan talent (T028).
#
# "docker-compose kedua repo hidup": file ini adalah override di atas compose
# backend (`tania-backend/docker-compose.yml`). Dari root repo frontend:
#
#   docker compose -f ../tania-backend/docker-compose.yml -f e2e/docker-compose.e2e.yml up -d --build
#
# Yang ditambahkan di sini:
#   * api   — CORS_ALLOWED_ORIGINS untuk origin aplikasi Next (browser → API
#             lintas origin; tanpa ini preflight ditolak allowlist kosong).
#   * web   — aplikasi Next (Dockerfile repo ini) dengan NEXT_PUBLIC_GRAPHQL_URL
#             yang bisa ditimpa; port 3000 agar cocok dengan baseURL Playwright.
#
# Fixture laporan (karyawan/kontrak/CV E2E) disuntikkan terpisah:
#   docker compose -f ../tania-backend/docker-compose.yml -f e2e/docker-compose.e2e.yml \
#     exec -T postgres psql -U tania -d tania < e2e/seed-talent-report.sql
services:
  api:
    environment:
      CORS_ALLOWED_ORIGINS: ${E2E_CORS_ORIGIN:-http://localhost:3000}

  web:
    build:
      # Path relatif terhadap direktori proyek compose (folder compose backend).
      # Kedua repo adalah checkout sibling bernama `tania-dashboard`/`tania-backend`.
      context: ${E2E_WEB_CONTEXT:-../tania-dashboard}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:8080/graphql}
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started
