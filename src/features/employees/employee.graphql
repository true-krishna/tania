query Employee($id: ID!) {
  employee(id: $id) {
    id
    fullName
    nikMasked
    email
    birthDate
    gender
    phone
    address
    latestEducation
    institutionName
    major
    nomorInduk
    status
    assignable
    joinedAt
    contracts(first: 50) {
      totalCount
      edges {
        node {
          id
          contractNo
          contractType
          officeEmail
          nomorInduk
          bandPosition
          jobTitle
          jobLevel
          workLocation
          startDate
          endDate
          status
          endReason
          terminatedAt
          notes
          unit {
            id
            name
          }
          jobRole {
            id
            name
            chapter {
              id
              name
            }
          }
          createdAt
          updatedAt
        }
      }
    }
  }
}
