# Role assignment reads and writes `roleName` — the machine name stored in
# `users.role`, which is a built-in name (ADMIN, OPERATION, ...) or a custom
# role's name (W1/W3, FR-03 amandemen). `accessRole` remains the role's template.
mutation CreateUserAccount(
  $employeeId: ID!
  $email: String!
  $roleName: String!
  $temporaryPassword: String
) {
  createUserAccount(
    employeeId: $employeeId
    email: $email
    roleName: $roleName
    temporaryPassword: $temporaryPassword
  ) {
    id
    fullName
    email
    accessRole
    roleName
    status
  }
}

mutation UpdateUserAccessRole($userId: ID!, $roleName: String!) {
  updateUserAccessRole(userId: $userId, roleName: $roleName) {
    id
    fullName
    email
    accessRole
    roleName
    status
  }
}

mutation SetUserAccountStatus($userId: ID!, $status: AccountStatus!) {
  setUserAccountStatus(userId: $userId, status: $status) {
    id
    fullName
    email
    accessRole
    roleName
    status
  }
}

mutation RevokeUserSessions($userId: ID!) {
  revokeUserSessions(userId: $userId)
}
