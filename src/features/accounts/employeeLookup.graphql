query EmployeeLookup($filter: EmployeeFilter, $first: Int = 25, $after: String) {
  employeeLookup(filter: $filter, first: $first, after: $after) {
    totalCount
    edges {
      node {
        id
        fullName
        nomorInduk
        email
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
