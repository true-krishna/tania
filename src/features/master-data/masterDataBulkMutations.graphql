mutation BulkSetUnitActive($ids: [ID!]!, $isActive: Boolean!) {
  bulkSetUnitActive(ids: $ids, isActive: $isActive) {
    succeeded {
      index
    }
    failed {
      index
      error {
        code
        message
      }
    }
  }
}

