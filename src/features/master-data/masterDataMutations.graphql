mutation CreateUnit($code: String!, $name: String!) {
  createUnit(code: $code, name: $name) {
    id
    code
    name
    isActive
    projects {
      id
      name
    }
  }
}

mutation UpdateUnit($id: ID!, $code: String!, $name: String!) {
  updateUnit(id: $id, code: $code, name: $name) {
    id
    code
    name
    isActive
    projects {
      id
      name
    }
  }
}

mutation SetUnitActive($id: ID!, $isActive: Boolean!) {
  setUnitActive(id: $id, isActive: $isActive) {
    id
    code
    name
    isActive
    projects {
      id
      name
    }
  }
}

