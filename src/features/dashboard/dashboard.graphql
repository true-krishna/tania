query Dashboard {
  dashboard {
    __typename
    ... on AdminDashboard {
      talentsPerChapter {
        chapter {
          id
          name
        }
        count
      }
      accountsPerRole {
        role
        count
      }
      inactiveAccounts
      masterDataActiveCounts {
        kind
        active
        inactive
      }
    }
    ... on OperationDashboard {
      totalActiveEmployees
      employeesPerUnit {
        unit {
          id
          name
        }
        count
      }
      nonAssignableEmployees
      recentEmployeeChanges {
        id
        fullName
        nomorInduk
      }
      contractsExpiringIn90Days
      contractsExpiringIn30Days
      preRetirementEmployees
    }
    ... on ChapterDashboard {
      unassignedTalents {
        id
        fullName
        nomorInduk
      }
    }
    ... on TalentDashboard {
      activeAssignments {
        id
        periodStart
        periodEnd
        status
        project {
          id
          name
        }
        jobRole {
          id
          name
        }
      }
    }
  }
}