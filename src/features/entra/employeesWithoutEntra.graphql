query EmployeesWithoutEntra(
  $search: String
  $sortBy: EntraEmployeeSortField
  $sortDirection: SortDirection
  $first: Int = 25
  $after: String
) {
  employeesWithoutEntra(
    search: $search
    sortBy: $sortBy
    sortDirection: $sortDirection
    first: $first
    after: $after
  ) {
    totalCount
    edges {
      node {
        id
        fullName
        email
        status
        entraProvision {
          status
          action
          upn
          notifyStatus
          notifyError
          needsReprovision
          lastError
          updatedAt
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
