# T015 — dokumen query laporan talent (kontrak sementara untuk client-preset).
#
# Dituju codegen (`preset: "client"`) saat T025 (codegen swap): setelah
# `graph/schema.graphqls` memuat fragmen §5 plan-003, **rename file ini kembali
# ke `talent-report.graphql`** (akhiran `.pending` sengaja di luar glob
# `src/features/**/*.graphql` agar `npm run codegen` tetap hijau tanpa
# pengecualian konfigurasi — T032), jalankan `npm run codegen`, lalu ganti
# dokumen hand-built di `useTalentReport.ts` dengan hasil generate.
# Sumber kebenaran: plan-003 (TAN-151) §5 — kontrak beku (D10).

query TalentReportRange {
  talentReportRange {
    startMonth
    endMonth
  }
}

query TalentReport($period: TalentReportPeriodInput!) {
  talentReport(period: $period) {
    snapshotMonth
    roleDistribution {
      label
      count
      kind
    }
    generationDistribution {
      label
      count
      kind
    }
    educationDistribution {
      label
      count
      kind
    }
    workLocationDistribution {
      label
      count
      kind
    }
    movementTrend {
      month
      newTalent
      churn
    }
  }
}
