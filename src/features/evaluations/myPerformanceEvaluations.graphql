query MyPerformanceEvaluations {
  myPerformanceEvaluations {
    id
    status
    summaryAchievement
    developmentNotes
    period {
      id
      name
      startDate
      endDate
      state
    }
    answers {
      criterion {
        id
        label
        answerType
        position
      }
      valueNumeric
      valueBool
      valueText
    }
    updatedAt
  }
}