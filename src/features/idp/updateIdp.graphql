mutation UpdateIdp($id: ID!, $input: UpdateIdpInput!) {
  updateIdp(id: $id, input: $input) {
    id
    status
    developmentObjective
    currentAssessment
    gapAnalysis
    timelineStart
    timelineEnd
    successIndicators
    revisions {
      id
      revisionNo
      changeNote
      createdAt
    }
  }
}