query Idp($id: ID!) {
  idp(id: $id) {
    id
    status
    developmentObjective
    currentAssessment
    gapAnalysis
    timelineStart
    timelineEnd
    successIndicators
    talent {
      id
      fullName
      nomorInduk
      jobRole {
        id
        name
      }
    }
    actions {
      id
      description
      method
      status
      dueDate
    }
    reviews {
      id
      reviewDate
      summary
      followUp
      createdBy {
        id
        fullName
      }
    }
    revisions {
      id
      revisionNo
      changeNote
      createdAt
      changedBy {
        id
        fullName
      }
    }
  }
}